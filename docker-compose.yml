services:
  site:
    build:
      context: .
    image: puzzli-site-dev
    container_name: puzzli-site
    ports:
      - "${PUZZLI_SITE_PORT:-5174}:5173"
    environment:
      VITE_MANAGEMENT_API_URL: ""
      VITE_DEV_API_PROXY_TARGET: http://host.docker.internal:5005
      CHOKIDAR_USEPOLLING: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    restart: unless-stopped

volumes:
  node_modules:
